<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>居家30分鐘 · 體態訓練</title>
<style>
:root{
  --bg:#F6F4EE;
  --paper:#FFFFFF;
  --ink:#16201C;
  --accent:#1E6F57;
  --accent-dark:#123F32;
  --accent-soft:#E1EEE8;
  --line:#DAD5C6;
  --muted:#767C72;
  --warn:#A6461F;
  --warn-soft:#F3E2D9;
  --radius:2px;
  font-size:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang TC","Noto Sans TC",Helvetica,Arial,sans-serif;
  min-height:100vh;
  padding-bottom:72px;
}
.eyebrow{
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.01em;}
.tabular{font-variant-numeric:tabular-nums;}

/* ===== Top bar ===== */
.topbar{
  background:var(--accent-dark);
  color:#fff;
  padding:18px 18px 16px;
  position:sticky;top:0;z-index:20;
}
.topbar .brand-eyebrow{
  font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#9FC7B8;font-weight:700;
}
.topbar h1{
  font-size:19px;letter-spacing:.02em;margin-top:2px;
  display:flex;align-items:baseline;gap:8px;
}
.topbar h1 .tick{
  display:inline-block;width:7px;height:7px;background:#7FD9B4;border-radius:1px;
}
.topbar .sub{font-size:12px;color:#BFD9CD;margin-top:3px;}

/* ===== Bottom nav ===== */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--paper);
  border-top:1px solid var(--line);
  z-index:30;
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  appearance:none;border:none;background:none;
  padding:10px 4px 8px;
  font-family:inherit;color:var(--muted);
  font-size:11px;letter-spacing:.04em;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;
}
.tabbar button .dot{width:5px;height:5px;border-radius:50%;background:transparent;}
.tabbar button.active{color:var(--accent-dark);font-weight:700;}
.tabbar button.active .dot{background:var(--accent);}

/* ===== Layout ===== */
main{max-width:640px;margin:0 auto;padding:16px;}
.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:14px;
}
.card + .card{margin-top:0;}
.section-title{
  display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.section-title .num{
  font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.06em;
}
.section-title h2{font-size:15px;}

/* ===== Buttons ===== */
.btn{
  appearance:none;border:1px solid var(--ink);background:var(--ink);color:#fff;
  font-family:inherit;font-weight:700;font-size:13px;letter-spacing:.03em;
  padding:11px 16px;border-radius:var(--radius);cursor:pointer;text-align:center;
}
.btn.ghost{background:transparent;color:var(--ink);}
.btn.accent{background:var(--accent);border-color:var(--accent);}
.btn.block{width:100%;display:block;}
.btn.sm{padding:7px 10px;font-size:11px;}
.btn:disabled{opacity:.4;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}

/* ===== Home tab ===== */
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:4px;}
.week-day{
  text-align:center;padding:8px 2px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--bg);
}
.week-day.today{border-color:var(--accent);}
.week-day .wd{font-size:9px;color:var(--muted);letter-spacing:.05em;}
.week-day .dnum{font-size:12px;font-weight:700;margin:3px 0;}
.week-day .badge{
  display:inline-block;min-width:18px;height:18px;line-height:18px;font-size:11px;font-weight:800;
  background:var(--accent);color:#fff;border-radius:50%;
}
.week-day .badge.empty{background:transparent;color:var(--line);border:1px dashed var(--line);}

.daypick{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.daypick .dbtn{
  border:1px solid var(--line);background:var(--paper);border-radius:var(--radius);
  padding:12px;text-align:left;cursor:pointer;font-family:inherit;
}
.daypick .dbtn .dl{font-size:10px;letter-spacing:.14em;color:var(--accent);font-weight:800;}
.daypick .dbtn .dn{font-size:14px;font-weight:700;margin-top:2px;}
.daypick .dbtn .dm{font-size:11px;color:var(--muted);margin-top:2px;}
.daypick .dbtn.suggested{border-color:var(--accent);background:var(--accent-soft);}

.note{
  font-size:12.5px;line-height:1.6;color:var(--muted);
  border-left:2px solid var(--accent);padding:6px 0 6px 10px;margin-top:8px;
}

/* ===== Session / today ===== */
.dayhead{
  background:var(--accent-dark);color:#fff;padding:14px 16px;border-radius:var(--radius);margin-bottom:14px;
}
.dayhead .dl{font-size:10px;letter-spacing:.2em;color:#9FC7B8;font-weight:800;}
.dayhead h2{color:#fff;font-size:18px;margin-top:2px;}
.dayhead .meta{font-size:11.5px;color:#BFD9CD;margin-top:5px;}

.warmup-item{display:flex;gap:9px;align-items:flex-start;padding:6px 0;font-size:13px;}
.warmup-item input{margin-top:3px;}

.ss-block{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.ss-head{
  background:var(--accent);color:#fff;padding:9px 12px;
  display:flex;justify-content:space-between;align-items:center;
}
.ss-head .t{font-size:12px;font-weight:800;letter-spacing:.06em;}
.ss-head .r{font-size:10.5px;opacity:.85;}
.ex-row{padding:10px 12px;border-top:1px solid var(--line);}
.ex-row:first-of-type{border-top:none;}
.ex-row .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.ex-row .name{font-size:14px;font-weight:700;}
.ex-row .target{font-size:14px;font-weight:800;color:var(--accent-dark);white-space:nowrap;}
.ex-row .cue{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5;}
.flow{font-size:11px;color:var(--muted);padding:8px 12px;background:var(--bg);border-top:1px solid var(--line);}

.rir-row{padding:10px 12px;border-top:1px solid var(--line);background:var(--bg);}
.rir-label{font-size:11px;color:var(--muted);margin-bottom:6px;letter-spacing:.03em;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:6px 12px;
  font-size:11.5px;cursor:pointer;font-family:inherit;
}
.chip.sel{background:var(--ink);color:#fff;border-color:var(--ink);}

.done-row{padding:10px 12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px;}
.done-row label{font-size:12.5px;font-weight:700;}

.timer-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:12px;border:1px dashed var(--accent);border-radius:var(--radius);
  background:var(--accent-soft);color:var(--accent-dark);font-weight:800;font-size:13px;
  cursor:pointer;font-family:inherit;margin-top:2px;
}
.timer-btn.running{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);}

textarea{
  width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:10px;
  font-family:inherit;font-size:13px;resize:vertical;min-height:60px;background:var(--paper);color:var(--ink);
}

/* ===== Progress tab (ladder) ===== */
.ex-card{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;}
.ex-card .top{display:flex;justify-content:space-between;align-items:center;}
.ex-card .name{font-size:14px;font-weight:700;}
.ex-card .stage-label{font-size:11px;color:var(--accent-dark);font-weight:800;}
.ladder{display:flex;gap:4px;margin:10px 0 8px;}
.rung{flex:1;height:9px;background:var(--line);border-radius:1px;}
.rung.on{background:var(--accent);}
.stage-ctrl{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.stage-ctrl .caption{font-size:11.5px;color:var(--muted);flex:1;line-height:1.5;}
.stepper{display:flex;align-items:center;gap:8px;}
.stepper button{
  width:30px;height:30px;border:1px solid var(--ink);background:var(--paper);border-radius:50%;
  font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;line-height:1;
}

/* ===== Ladder legend / guide ===== */
.ladder-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;}
.ladder-table th,.ladder-table td{
  border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top;
}
.ladder-table th{background:var(--bg);font-size:11px;letter-spacing:.04em;color:var(--muted);font-weight:700;}
.ladder-table td.step{font-weight:800;color:var(--accent-dark);white-space:nowrap;}

.faq-item{border-top:1px solid var(--line);padding:10px 0;}
.faq-item:first-child{border-top:none;}
.faq-item .q{font-size:13px;font-weight:700;display:flex;gap:8px;}
.faq-item .q .n{color:var(--accent);}
.faq-item .a{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.6;}

.sched-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px;}
.sched-table td{padding:7px 4px;border-top:1px solid var(--line);}
.sched-table td:first-child{font-weight:800;color:var(--accent-dark);width:60px;}

/* ===== Log tab ===== */
.log-item{border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px;}
.log-item .top{display:flex;justify-content:space-between;align-items:baseline;}
.log-item .date{font-size:13px;font-weight:800;}
.log-item .day{font-size:11px;color:var(--accent-dark);font-weight:800;}
.ss-dots{display:flex;gap:6px;margin-top:8px;}
.ss-dots span{
  font-size:10px;font-weight:700;padding:3px 7px;border-radius:20px;border:1px solid var(--line);color:var(--muted);
}
.ss-dots span.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dark);}
.log-item .pn{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5;}
.log-item .del{font-size:11px;color:var(--warn);background:none;border:none;font-family:inherit;cursor:pointer;padding:0;margin-top:8px;}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}

.protein-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.protein-row .txt{font-size:12.5px;}
.protein-row .txt b{display:block;font-size:13.5px;color:var(--ink);}
.toggle{
  width:46px;height:26px;border-radius:20px;background:var(--line);position:relative;cursor:pointer;flex:none;
}
.toggle.on{background:var(--accent);}
.toggle .knob{
  position:absolute;top:2px;left:2px;width:22px;height:22px;background:#fff;border-radius:50%;
  transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25);
}
.toggle.on .knob{left:22px;}

.hidden{display:none !important;}

/* ===== 深色主題 ===== */
[data-theme="dark"]{
  --bg:#121614;
  --paper:#1B211E;
  --ink:#E8EDE9;
  --accent:#4FB391;
  --accent-dark:#0E1715;
  --accent-soft:#1E2E28;
  --line:#2C3531;
  --muted:#939C96;
  --warn:#E88A62;
  --warn-soft:#33231C;
}
[data-theme="dark"] .topbar{background:#0E1715;}
[data-theme="dark"] .topbar .brand-eyebrow{color:#5E9C89;}
[data-theme="dark"] .topbar .sub{color:#8FA69B;}
[data-theme="dark"] img,[data-theme="dark"] .sk{filter:brightness(.92);}
/* 主題切換鈕 */
.themebtn{
  position:absolute;top:16px;right:16px;
  width:34px;height:34px;border-radius:50%;
  border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.10);color:#fff;
  font-size:15px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.themebtn:active{transform:scale(.94);}


/* ===== 動作示意圖 ===== */
.figrow{
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:6px;
  background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);padding:10px 8px;margin-bottom:4px;
}
.figrow.one{grid-template-columns:1fr;max-width:60%;margin-left:auto;margin-right:auto;}
.figbox{min-width:0;}
.figsvg{width:100%;height:auto;display:block;}
.figbox figcaption{
  font-size:11px;line-height:1.45;text-align:center;
  color:var(--muted);margin-top:2px;padding:0 2px;
}
.figarrow{color:var(--accent);font-size:19px;font-weight:700;opacity:.65;}
/* 圖形顏色全部走變數 → 深色模式自動反轉 */
.figsvg .fl{stroke:var(--ink);stroke-linecap:round;fill:none;}
.figsvg .fl.dim{opacity:.30;}
.figsvg .fh{stroke:var(--ink);fill:var(--paper);}
.figsvg .fg{stroke:var(--ink);opacity:.25;}
.figsvg .fp{fill:var(--accent);}
.figsvg .fp2{fill:var(--ink);opacity:.17;}
.figsvg .fc{stroke:var(--accent);opacity:.55;fill:none;}
.figsvg .fa{stroke:var(--warn);fill:var(--warn);}

/* ===== 動作庫 ===== */
.exsearch{
  display:flex;align-items:center;gap:8px;
  background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);padding:10px 12px;margin-bottom:12px;
}
.exsearch input{
  flex:1;border:0;background:transparent;color:var(--ink);
  font-size:15px;font-family:inherit;outline:none;min-width:0;
}
.exsearch .ic{opacity:.5;font-size:14px;}
.exfilters{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px;}
.exfilters button{
  flex:0 0 auto;padding:6px 12px;font-size:12px;font-weight:700;
  border-radius:999px;border:1px solid var(--line);
  background:var(--paper);color:var(--muted);cursor:pointer;
  font-family:inherit;letter-spacing:.02em;
}
.exfilters button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.exrow{
  display:flex;align-items:center;gap:12px;
  padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer;
}
.exrow:active{opacity:.6;}
.exrow .ini{
  flex:0 0 38px;height:38px;border-radius:var(--radius);
  background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;letter-spacing:.02em;
}
.exrow .tx{flex:1;min-width:0;}
.exrow .n{font-size:14.5px;font-weight:700;}
.exrow .e{font-size:10.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:1px;}
.exrow .ar{color:var(--muted);font-size:18px;flex:0 0 auto;}
.exback{
  display:inline-flex;align-items:center;gap:5px;
  background:none;border:0;color:var(--accent);
  font-size:13px;font-weight:700;font-family:inherit;
  cursor:pointer;padding:0;margin-bottom:12px;
}
.exhead{margin-bottom:16px;}
.exhead h2{font-size:22px;letter-spacing:.01em;}
.exhead .en{font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-top:3px;}
.exchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.exchip{
  font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);
}
.exsec{margin-top:20px;}
.exsec > .t{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);font-weight:800;margin-bottom:9px;
}
.exsteps{counter-reset:s;list-style:none;}
.exsteps li{
  counter-increment:s;position:relative;
  padding-left:30px;margin-bottom:11px;font-size:14px;line-height:1.62;
}
.exsteps li::before{
  content:counter(s);position:absolute;left:0;top:1px;
  width:21px;height:21px;border-radius:50%;
  background:var(--accent);color:#fff;
  font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
.exmiss{list-style:none;}
.exmiss li{
  position:relative;padding-left:20px;margin-bottom:9px;
  font-size:13.5px;line-height:1.6;color:var(--ink);
}
.exmiss li::before{
  content:'';position:absolute;left:4px;top:8px;
  width:6px;height:6px;border-radius:50%;background:var(--warn);
}
.exscale{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.exscale div{
  background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);padding:11px 12px;
}
.exscale .h{font-size:10.5px;letter-spacing:.1em;font-weight:800;color:var(--muted);text-transform:uppercase;}
.exscale p{font-size:13px;line-height:1.55;margin-top:5px;}
.exsafe{
  background:var(--warn-soft);border-left:3px solid var(--warn);
  padding:11px 13px;border-radius:var(--radius);
  font-size:13.5px;line-height:1.6;
}
.exsafe b{color:var(--warn);}
.exwhere{
  background:var(--paper);border:1px solid var(--line);
  border-radius:var(--radius);padding:11px 13px;
  font-size:13px;line-height:1.6;color:var(--muted);
}
.exwhere b{color:var(--ink);}
.exresume{
  position:sticky;top:0;z-index:15;
  display:flex;align-items:center;gap:8px;
  background:var(--accent);color:#fff;
  padding:11px 14px;margin:-2px 0 14px;
  border-radius:var(--radius);
  font-size:13.5px;font-weight:700;
  border:0;width:100%;font-family:inherit;cursor:pointer;
  letter-spacing:.02em;
}
.exresume:active{opacity:.85;}
.exresume .sp{margin-left:auto;font-weight:500;opacity:.85;font-size:12px;}

/* ===== 實際次數／STEP／備份 ===== */
.bkwarn{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);padding:12px 14px;border-radius:var(--radius);margin-bottom:12px;font-size:13px;line-height:1.6;}
.bkwarn b{color:var(--warn);}
.bkwarn .btn{margin-top:8px;}
.steptag{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;}
.deftag{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);}
.lastline{font-size:12px;color:var(--muted);margin-top:4px;}
.acttbl{width:calc(100% - 24px);margin:8px 12px 4px;border-collapse:collapse;font-size:12.5px;}
.acttbl th{font-size:10.5px;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:left;padding:4px 4px;}
.acttbl td{padding:3px 4px;}
.acttbl td.rn{width:52px;color:var(--muted);font-weight:700;white-space:nowrap;}
.acttbl input{width:100%;box-sizing:border-box;padding:7px 8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:var(--radius);font-size:15px;font-family:inherit;}
.actnote{font-size:11.5px;color:var(--muted);margin:0 12px 6px;}
.altsub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.swp .opt .row2{display:flex;gap:6px;margin-top:8px;}
.swp .opt .row2 .btn{flex:1;}
/* ===== 換動作 ===== */
.swapbtn{background:none;border:1px solid var(--accent);color:var(--accent);font-size:11px;font-weight:800;font-family:inherit;
  padding:3px 9px;border-radius:999px;cursor:pointer;margin-left:6px;letter-spacing:.03em;}
.swaptag{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);}
.swp{border-top:1px solid var(--line);padding:10px 12px 12px;background:var(--bg);}
.swp .st{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--muted);margin-bottom:8px;}
.swp .opt{border:1px solid var(--line);background:var(--paper);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;}
.swp .opt .an{font-size:13.5px;font-weight:800;}
.swp .opt .ag{font-size:11px;color:var(--muted);margin-top:2px;}
.swp .opt .rx{font-size:12px;margin-top:6px;}
.swp .opt .rx b{color:var(--accent);}
.swp .opt .go{margin-top:8px;width:100%;}
.exalt{list-style:none;padding:0;margin:0;}
.exalt li{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:11px 12px;margin-bottom:8px;}

/* unique exercise list for progression ladder */
function allExercises(){
  const set = new Map();
  Object.values(DAYS).forEach(d=>d.supersets.forEach(ss=>{
    [ss.a, ss.b].forEach(ex=>{ if(!set.has(ex.name)) set.set(ex.name, ex); });
  }));
  return [...set.values()];
}

/* ============ STATE / STORAGE ============ */
const STORE_KEY = "h30_home_program_v1";
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {sessions:[], stages:{}, protein:{}, theme:"light"};
}
function saveState(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
let state = loadState();
if(!state.defaultSwaps) state.defaultSwaps = {};

/* ============ 訓練中草稿（Draft） ============
   解決手機瀏覽器把背景分頁記憶體整個清掉／重整，導致進行中的訓練
   （含 startTime，用來算時長）全部消失的問題。
   跟正式紀錄分開存一個 key，不會混進已完成的訓練。
   不做防抖、直接寫：系統可能在切出去的瞬間就回收分頁，
   延遲寫入等於在賭它不會在那零點幾秒內動手。 */
const DRAFT_KEY = STORE_KEY + "_draft";
function saveDraft(){
  if(!sessionCtx) return;
  try{
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      sessionCtx: sessionCtx,
      savedAt: Date.now()
    }));
  }catch(e){}
}
function clearDraft(){
  try{ localStorage.removeItem(DRAFT_KEY); }catch(e){}
}
function restoreDraftIfAny(){
  let raw = null;
  try{ raw = localStorage.getItem(DRAFT_KEY); }catch(e){ return; }
  if(!raw) return;
  let draft;
  try{ draft = JSON.parse(raw); }catch(e){ clearDraft(); return; }
  const ctx = draft && draft.sessionCtx;
  // 防呆：草稿裡的 day 必須還存在於現在的課表，否則是舊版資料，直接丟掉不要
  // 拿去 render 導致整個 app 掛掉。
  if(!ctx || !ctx.day || !DAYS[ctx.day]){ clearDraft(); return; }
  const rounds = Array.isArray(ctx.rounds) ? ctx.rounds.reduce((a,b)=>a+(b||0),0) : 0;
  const ago = draft.savedAt ? Math.max(0, Math.round((Date.now()-draft.savedAt)/60000)) : null;
  const msg = "偵測到一次中斷的訓練（DAY "+ctx.day+"，已完成 "+rounds+" 輪"
    + (ago!==null ? "，約 "+ago+" 分鐘前中斷" : "") + "）。要繼續這次訓練嗎？\n\n選「取消」會放棄這次沒存檔的紀錄。";
  if(confirm(msg)){
    sessionCtx = ctx;
    if(!sessionCtx.swaps) sessionCtx.swaps = {};
    if(!sessionCtx.actual) sessionCtx.actual = blankActual(sessionCtx.day);
    // timer 是 UI 暫存狀態，重整後 interval 已經沒了，重置成停止狀態避免顯示錯亂
    sessionCtx.timer = {ss:null, secs:0, running:false};
    currentTab = "session";
  } else {
    clearDraft();
  }
}

/* 開始／結束時間戳都在才算時長；不足 1 分鐘算 1 分鐘，避免顯示「0 分鐘」看起來像沒運動 */
function sessionDurationMin(s){
  if(typeof s.startTime!=="number" || typeof s.endTime!=="number") return null;
  return Math.max(1, Math.round((s.endTime - s.startTime)/60000));
}

function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmtShort(dateStr){
  const [y,m,d] = dateStr.split("-");
  return `${m}/${d}`;
}

/* 組裝「實際要做的動作」：有換就回傳替代動作（名稱、目標、做法重點換掉）。
   替代動作用自己的名字記進度階梯，不會和原動作混在一起。 */
function exOf(dayKey, i, slot, swaps){
  const base = DAYS[dayKey].supersets[i][slot];
  const ai = swaps ? swaps[i+slot] : null;
  if(ai===null || ai===undefined) return base;
  const a = (ALT_LIB[base.en]||[])[ai];
  if(!a) return base;
  return {name:a.n, en:null, target:(a.t||base.target), cue:"替代 "+base.name+"｜需要："+a.g+"。"+a.c, swapOf:base.name};
}
/* 「以後都用這個替代」：key＝原動作 en，value＝替代動作名稱。同一個動作出現在不同天也一起套用 */
function defaultSwapsFor(dayKey){
  const out = {}, ds = state.defaultSwaps||{};
  DAYS[dayKey].supersets.forEach((ss,i)=>["a","b"].forEach(slot=>{
    const n = ds[ss[slot].en]; if(!n) return;
    const ai = (ALT_LIB[ss[slot].en]||[]).findIndex(a=>a.n===n);
    if(ai>=0) out[i+slot] = ai;
  }));
  return out;
}
function blankActual(dayKey){
  return DAYS[dayKey].supersets.map(ss=> Array.from({length:ss.rounds}, ()=>({a:"",b:""})));
}
/* 這個動作上一次實際做了多少（依動作名稱找，替代動作也有自己的紀錄） */
function lastActual(name){
  const ss = [...state.sessions].sort((x,y)=> (y.id||0)-(x.id||0));
  for(const s of ss){
    if(!s.actual || !DAYS[s.day]) continue;
    for(let i=0;i<DAYS[s.day].supersets.length;i++){
      for(const slot of ["a","b"]){
        if(exOf(s.day,i,slot,s.swaps).name!==name) continue;
        const v = (s.actual[i]||[]).map(r=>r[slot]).filter(x=>x!=="" && x!=null);
        if(v.length) return {date:s.date, vals:v};
      }
    }
  }
  return null;
}
function unitOf(target){ return /秒/.test(target) ? "秒" : "下"; }
/* 用過的替代動作（給進度階梯頁） */
function usedAlts(){
  const map = new Map();
  state.sessions.forEach(s=>{
    if(!s.swaps || !DAYS[s.day]) return;
    Object.keys(s.swaps).forEach(k=>{
      const i=+k.slice(0,-1), slot=k.slice(-1);
      if(!DAYS[s.day].supersets[i]) return;
      const e = exOf(s.day,i,slot,s.swaps);
      if(e.swapOf && !map.has(e.name)) map.set(e.name, e);
    });
  });
  Object.entries(state.defaultSwaps||{}).forEach(([en,n])=>{
    if(map.has(n)) return;
    const base = allExercises().find(e=>e.en===en);
    if(base) map.set(n,{name:n, swapOf:base.name});
  });
  return [...map.values()];
}
/* ===== 備份 ===== */
const BACKUP_DAYS = 14;
function backupDue(){
  if(!state.sessions.length) return false;
  if(!state.lastBackup) return true;
  return (Date.now()-state.lastBackup) > BACKUP_DAYS*86400000;
}
function sessionsSinceBackup(){
  if(!state.lastBackup) return state.sessions.length;
  return state.sessions.filter(s=> s.id > state.lastBackup).length;
}
function fmtTs(ts){
  const d=new Date(ts);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function doExport(){
  state.lastBackup = Date.now(); saveState();
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `h30-backup-${todayStr()}.json`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function flowFor(dayKey, i, swaps){
  const ss = DAYS[dayKey].supersets[i];
  const a = exOf(dayKey,i,"a",swaps), b = exOf(dayKey,i,"b",swaps);
  if(!a.swapOf && !b.swapOf) return ss.flow;
  return "先做 A："+a.target+" → 接著 B："+b.target+" → 休息 45 秒 → 算 1 輪，共做 "+ss.rounds+" 輪";
}

/* 課表 → 動作庫索引的來源（各 app 課表結構不同，這裡轉成統一格式） */
function EX_SOURCE(){
  const out = [];
  Object.entries(DAYS).forEach(([k,d])=>{
    d.supersets.forEach((ss,i)=>{
      [ss.a, ss.b].forEach(x=>{
        if(x && x.en) out.push({en:x.en, name:x.name, where:"DAY "+k+" · SS"+(i+1)});
      });
    });
  });
  return out;
}

/* ============================================================
   動作示意圖
   姿勢用「關節座標」描述，圖形由 figSVG() 畫出來，所以 40 幾個動作
   不用各畫一張圖，只要給起始／結束兩組座標。
   顏色全部用 currentColor / CSS 變數 → 深色淺色主題自動跟著變。
   座標系：viewBox 0 0 200 200，地面 y=178，人物面向右。
   ============================================================ */
const FIG_GROUND = 178;

/* 關節縮寫：
   hdc 頭中心 / nk 頸 / sh 肩 / el 肘 / wr 腕 / hp 髖 / kn 膝 / an 踝 / to 腳尖
   far* = 另一側手腳（畫淺一點，做出立體感） */
function figSVG(p, opts){
  opts = opts || {};
  const L = (a,b,w,cls) => (!a||!b) ? "" :
    `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="${cls||'fl'}" stroke-width="${w||5}"/>`;
  let g = "";

  // 地面
  if(opts.ground !== false){
    g += `<line x1="8" y1="${FIG_GROUND}" x2="192" y2="${FIG_GROUND}" class="fg" stroke-width="2"/>`;
  }
  // 器材（畫在人物後面）
  if(opts.propsBack) g += opts.propsBack;

  // 遠側手腳：先畫，顏色淡
  g += L(p.hp, p.farKn, 5, 'fl dim');
  g += L(p.farKn, p.farAn, 5, 'fl dim');
  g += L(p.farAn, p.farTo, 4, 'fl dim');
  g += L(p.sh, p.farEl, 4.5, 'fl dim');
  g += L(p.farEl, p.farWr, 4.5, 'fl dim');

  // 軀幹、近側四肢
  g += L(p.nk, p.hp, 6.5);
  g += L(p.hp, p.kn, 5.5);
  g += L(p.kn, p.an, 5.5);
  g += L(p.an, p.to, 4.5);
  g += L(p.sh, p.el, 5);
  g += L(p.el, p.wr, 5);

  // 頭
  // 頭是實心（填卡片底色）：讓從頭後方經過的手臂被遮住，讀起來才像「手在頭後面」，
  // 而不是一條線直接穿過臉。
  if(p.hdc) g += `<circle cx="${p.hdc[0]}" cy="${p.hdc[1]}" r="${p.hdr||10}" class="fh" stroke-width="4.5"/>`;

  // 器材（畫在人物前面）
  if(opts.propsFront) g += opts.propsFront;
  // 箭頭／標註
  if(opts.marks) g += opts.marks;
  return g;
}

/* ---------- 器材 ---------- */
// 啞鈴：橫桿＋兩端方塊。ang 是旋轉角度（度）
function dumbbell(x,y,ang,s){
  s = s || 1; ang = ang || 0;
  const w = 9*s, h = 7*s, gap = 5*s;
  return `<g transform="translate(${x},${y}) rotate(${ang})" class="fp">
    <rect x="${-gap}" y="${-1.6*s}" width="${gap*2}" height="${3.2*s}" rx="1"/>
    <rect x="${-gap-w/2}" y="${-h/2}" width="${w/2}" height="${h}" rx="1.5"/>
    <rect x="${gap}" y="${-h/2}" width="${w/2}" height="${h}" rx="1.5"/>
  </g>`;
}
// 槓鈴：長桿＋兩端槓片
function barbell(x,y,ang,half){
  half = half || 34;
  return `<g transform="translate(${x},${y}) rotate(${ang||0})" class="fp">
    <rect x="${-half}" y="-1.8" width="${half*2}" height="3.6" rx="1.5"/>
    <rect x="${-half-2}" y="-9" width="5" height="18" rx="2"/>
    <rect x="${half-3}" y="-9" width="5" height="18" rx="2"/>
  </g>`;
}
// 椅子／臥推椅（側視）
function bench(x,y,w,h){
  w=w||54; h=h||9;
  return `<g class="fp2">
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2"/>
    <rect x="${x+4}" y="${y+h}" width="4" height="${FIG_GROUND-y-h}"/>
    <rect x="${x+w-8}" y="${y+h}" width="4" height="${FIG_GROUND-y-h}"/>
  </g>`;
}
// 有靠背的椅子（側視，靠背在左）
function chairBack(x,y){
  return `<g class="fp2">
    <rect x="${x}" y="${y}" width="46" height="8" rx="2"/>
    <rect x="${x}" y="${y-38}" width="8" height="40" rx="2"/>
    <rect x="${x+4}" y="${y+8}" width="4" height="${FIG_GROUND-y-8}"/>
    <rect x="${x+38}" y="${y+8}" width="4" height="${FIG_GROUND-y-8}"/>
  </g>`;
}
// 牆／垂直面
function wall(x){
  return `<rect x="${x}" y="20" width="6" height="${FIG_GROUND-20}" rx="2" class="fp2"/>`;
}
// 單槓／高位滑輪橫桿
function highBar(y,x1,x2){
  return `<g class="fp2"><rect x="${x1||40}" y="${y}" width="${(x2||160)-(x1||40)}" height="4" rx="2"/></g>`;
}
// 纜繩
function cable(a,b){
  return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="fc" stroke-width="2"/>`;
}
// 機器立柱（右側）
function machine(x){
  return `<g class="fp2"><rect x="${x}" y="30" width="8" height="${FIG_GROUND-30}" rx="2"/></g>`;
}
// 箭頭：標示動作方向
function arrow(x1,y1,x2,y2){
  const ang = Math.atan2(y2-y1, x2-x1)*180/Math.PI;
  return `<g class="fa">
    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="2.2" stroke-dasharray="5 4"/>
    <g transform="translate(${x2},${y2}) rotate(${ang})">
      <path d="M0 0 L-7 -4 L-7 4 Z"/>
    </g>
  </g>`;
}

/* ---------- 器材掛在關節上 ----------
   姿勢只描述身體，器材依動作不同掛上去，所以同一個「深蹲」姿勢
   可以是高腳杯蹲（啞鈴在胸前）或背蹲舉（槓在肩上）。 */
function gearSVG(kind, p){
  if(!kind || !p) return "";
  const mid = (a,b,t)=> [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
  switch(kind){
    case 'db':      // 雙手各一顆啞鈴
      return dumbbell(p.wr[0], p.wr[1], 0) + (p.farWr ? dumbbell(p.farWr[0], p.farWr[1], 0, .85) : "");
    case 'db1':     // 單手一顆
      return dumbbell(p.wr[0], p.wr[1], 0);
    case 'goblet':  // 一顆抱在胸前
      { const c = mid(p.nk, p.hp, .28); return dumbbell(c[0]+10, c[1], 90); }
    case 'dbmid':   // 一顆垂在兩腿中間（相撲蹲）
      { const c = p.wr; return dumbbell(c[0], c[1], 90); }
    case 'bbBack':  // 槓在上背
      return barbell(p.sh[0]+2, p.sh[1]+4, 0, 30);
    case 'bbHand':  // 槓握在手上
      return barbell(p.wr[0], p.wr[1], 0, 30);
    case 'plate':   // 槓片／負重（提踵、單槓負重）
      return dumbbell(p.wr[0], p.wr[1], 90);
    default: return "";
  }
}

/* 畫一個動作的圖（起始／結束兩格，或單格） */
function figPanel(poseName, cap, gear){
  const pose = P[poseName];
  if(!pose) return "";
  const body = figSVG(pose.p, pose) + gearSVG(gear, pose.p);
  return `<figure class="figbox">
    <svg viewBox="0 0 200 200" class="figsvg" aria-hidden="true">${body}</svg>
    <figcaption>${cap}</figcaption>
  </figure>`;
}
function exFigures(en){
  const f = EX_FIG[en];
  if(!f) return "";
  if(f.one) return `<div class="figrow one">${figPanel(f.one[0], f.one[1], f.gear)}</div>`;
  return `<div class="figrow">
    ${figPanel(f.a[0], f.a[1], f.gear)}
    <div class="figarrow">→</div>
    ${figPanel(f.b[0], f.b[1], f.gear)}
  </div>`;
}

/* ============ 動作庫畫面 ============ */
let exQuery = "";
let exPart = "全部";
let exOpen = null;   // 目前展開的動作 en，null = 列表

function exIndex(){
  // 回傳 [{en, name, part, where:[...]}, ...]，依課表實際出現的動作組成。
  const map = {};
  EX_SOURCE().forEach(item=>{
    const lib = EX_LIB[item.en] || null;
    if(!map[item.en]) map[item.en] = {
      en:item.en, name:item.name,
      part: lib ? lib.part : "其他",
      where:[], lib:lib
    };
    map[item.en].where.push(item.where);
  });
  return Object.values(map);
}
function exParts(){
  const order = ["全部","下肢","上肢推","上肢拉","上肢","核心","全身","體能","其他"];
  const have = new Set(exIndex().map(x=>x.part));
  return order.filter(p=> p==="全部" || have.has(p));
}
// 訓練中來查動作時，給一個明確的回去入口。
// 不能讓人只能用下面的分頁列返回——那條路會清掉進行中的訓練。
function exResumeBar(){
  if(!sessionCtx) return "";
  return `<button class="exresume" data-exresume="1">‹ 返回訓練<span class="sp">進行中的訓練還在</span></button>`;
}
function renderExercises(){
  if(exOpen) return exResumeBar() + renderExerciseDetail(exOpen);
  const q = exQuery.trim().toLowerCase();
  let list = exIndex();
  if(exPart!=="全部") list = list.filter(x=> x.part===exPart);
  if(q) list = list.filter(x=>
    x.name.toLowerCase().includes(q) || x.en.toLowerCase().includes(q) ||
    (x.lib && (x.lib.muscles||"").toLowerCase().includes(q))
  );
  list.sort((a,b)=> a.part===b.part ? a.name.localeCompare(b.name,"zh-Hant") : 0);
  return `
    ${exResumeBar()}
    <div class="card">
      <div class="section-title"><span class="num">動作</span><h2>動作庫</h2></div>
      <div class="exsearch">
        <span class="ic">🔍</span>
        <input id="exq" type="text" placeholder="搜尋動作名稱或部位" value="${exQuery.replace(/"/g,'&quot;')}">
      </div>
      <div class="exfilters">
        ${exParts().map(p=>`<button data-expart="${p}" class="${p===exPart?'on':''}">${p}</button>`).join("")}
      </div>
      ${list.length===0 ? `<div class="exnone">找不到「${exQuery}」<br>試試中文名稱、英文名稱或部位</div>` :
        list.map(x=>`
          <div class="exrow" data-exopen="${x.en}">
            <div class="ini">${x.part}</div>
            <div class="tx">
              <div class="n">${x.name}</div>
              <div class="e">${x.en}</div>
            </div>
            <div class="ar">›</div>
          </div>`).join("")}
    </div>
  `;
}
function renderExerciseDetail(en){
  const item = exIndex().find(x=>x.en===en);
  if(!item) return `<div class="exnone">找不到這個動作</div>`;
  const L = item.lib;
  const where = [...new Set(item.where)].join("、");
  return `
    <div class="card">
      <button class="exback" data-exback="1">‹ 返回動作庫</button>
      <div class="exhead">
        <h2>${item.name}</h2>
        <div class="en">${item.en}</div>
        <div class="exchips">
          <span class="exchip">${item.part}</span>
          ${L && L.muscles ? `<span class="exchip">${L.muscles}</span>` : ""}
          ${L && L.gear ? `<span class="exchip">${L.gear}</span>` : ""}
        </div>
      </div>

}
function bindExercises(){
  const q = document.getElementById("exq");
  if(q) q.addEventListener("input", e=>{
    exQuery = e.target.value;
    // 只重畫列表，不動整頁，否則每打一個字輸入框就失焦
    const host = document.getElementById("view");
    const cur = e.target.selectionStart;
    host.innerHTML = renderExercises();
    bindDynamic();
    const nq = document.getElementById("exq");
    if(nq){ nq.focus(); nq.setSelectionRange(cur, cur); }
  });
  document.querySelectorAll("[data-expart]").forEach(b=> b.addEventListener("click", ()=>{
    exPart = b.dataset.expart; render();
  }));
  document.querySelectorAll("[data-exopen]").forEach(b=> b.addEventListener("click", ()=>{
    exOpen = b.dataset.exopen; window.scrollTo(0,0); render();
  }));
  const resume = document.querySelector("[data-exresume]");
  if(resume) resume.addEventListener("click", ()=>{
    exOpen = null; currentTab = "session"; window.scrollTo(0,0); render();
  });
  const back = document.querySelector("[data-exback]");
  if(back) back.addEventListener("click", ()=>{ exOpen = null; window.scrollTo(0,0); render(); });
  // 訓練中／說明頁的「怎麼做」快捷
  document.querySelectorAll("[data-exjump]").forEach(b=> b.addEventListener("click", (e)=>{
    e.stopPropagation();
    exOpen = b.dataset.exjump; currentTab = "ex"; window.scrollTo(0,0); render();
  }));
}

function applyTheme(){
  const t = state.theme || "light";
  document.body.setAttribute("data-theme", t);
  const btn = document.getElementById("themeBtn");
  if(btn){
    btn.textContent = t==="dark" ? "☀" : "☾";
    btn.setAttribute("aria-label", t==="dark" ? "切換淺色" : "切換深色");
  }
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", t==="dark" ? "#0D0F11" : THEME_LIGHT_BAR);
}
function toggleTheme(){
  state.theme = (state.theme==="dark") ? "light" : "dark";
  saveState(); applyTheme();
}

/* ============ ROUTER ============ */
let currentTab = "home";
let sessionCtx = null; // {day, checked:{ss0:false,...}, rir:{}, note:""}

const tabbar = document.querySelectorAll(".tabbar button");
tabbar.forEach(btn=>{
  // 切換分頁本來就會丟掉進行中的 sessionCtx，草稿也要一起清掉——
  // 否則 app 認為「沒有訓練中」但草稿還留著，下次開啟會莫名跳出還原提示。
  btn.addEventListener("click", ()=>{ currentTab = btn.dataset.tab; if(sessionCtx) clearDraft(); sessionCtx = null; render(); });
});

function render(){
  tabbar.forEach(b=> b.classList.toggle("active", b.dataset.tab===currentTab));
  const view = document.getElementById("view");
  if(currentTab==="home") view.innerHTML = renderHome();
  else if(currentTab==="progress") view.innerHTML = renderProgress();
  else if(currentTab==="log") view.innerHTML = renderLog();
  else if(currentTab==="guide") view.innerHTML = renderGuide();
  else if(currentTab==="ex") view.innerHTML = renderExercises();
  else if(currentTab==="session") view.innerHTML = renderSession();
  bindDynamic();
  saveDraft();
}

/* ============ SESSION (live workout) ============ */
function startSession(dayKey){
  sessionCtx = {
    day: dayKey,
    // 開始／結束時間戳——相減得出訓練時長。不是碼表累加，所以中途切出去、
    // 鎖螢幕、分頁被凍結都不影響準確度。用途：讓紀錄能顯示「日期＋時長」，
    // 符合運動i台灣這類活動要求的運動紀錄佐證格式。
    startTime: Date.now(),
    endTime: null,
    warmupChecked: DAYS[dayKey].warmup.map(()=>false),
    rounds: DAYS[dayKey].supersets.map(()=>0), // completed rounds 0-3
    swaps: defaultSwapsFor(dayKey),  // {"0a":替代動作編號}，key＝第幾組 superset + a/b
    actual: blankActual(dayKey),     // 每輪每個動作實際做的次數／秒數
    swapOpen: null,
    rir: DAYS[dayKey].supersets.map(()=>null),
    note: "",
    timer: {ss:null, secs:0, running:false}
  };
  currentTab = "session";
  render();
}

let timerInterval = null;
function renderSession(){
  const d = DAYS[sessionCtx.day];
  return `
    <div class="dayhead">
      <div class="dl">DAY ${sessionCtx.day}</div>
      <h2>${d.name}</h2>
      <div class="meta">${d.meta}</div>
    </div>

    <div class="card">
      <div class="section-title"><span class="num">熱身</span><h2>3 分鐘</h2></div>
      ${d.warmup.map((w,i)=>`
        <label class="warmup-item">
          <input type="checkbox" data-warm="${i}" ${sessionCtx.warmupChecked[i]?"checked":""}>
          <span>${w}</span>
        </label>`).join("")}
    </div>

    ${d.supersets.map((ss,i)=>renderSuperset(ss,i)).join("")}

    <div class="card">
      <div class="section-title"><span class="num">備註</span><h2>哪個動作該進步了？</h2></div>
      <textarea id="sessionNote" placeholder="例如：SS1-A 高腳杯蹲已經很輕鬆，下次加次數">${sessionCtx.note}</textarea>
    </div>

    <div class="btn-row">
      <button class="btn accent block" id="finishSession">完成本次訓練 · 存入紀錄</button>
    </div>
    <div class="btn-row" style="margin-top:8px;">
      <button class="btn ghost block" id="cancelSession">取消，返回本週</button>
    </div>
  `;
}

function renderSwapPanel(i, slot){
  const day = sessionCtx.day;
  const base = DAYS[day].supersets[i][slot];
  const cur = sessionCtx.swaps ? sessionCtx.swaps[i+slot] : null;
  const def = (state.defaultSwaps||{})[base.en] || null;
  const alts = ALT_LIB[base.en]||[];
  return `<div class="swp">
    <div class="st">選一個改做（目標會一起換）</div>
    ${(cur!==null && cur!==undefined) || def ? `<div class="opt">
      <div class="an">原動作：${base.name}</div>
      <div class="rx">目標 <b>${base.target}</b></div>
      <div class="row2">
        ${cur!==null && cur!==undefined ? `<button class="btn ghost sm" data-swapto="${i}-${slot}-back">今天換回</button>` : ""}
        ${def ? `<button class="btn ghost sm" data-swapdef="${i}-${slot}-back">以後都做原動作</button>` : ""}
      </div></div>` : ""}
    ${alts.map((a,ai)=>{
      const on = cur===ai, isDef = def===a.n;
      return `<div class="opt">
        <div class="an">${a.n}${on?"（目前）":""}${isDef?`<span class="deftag">預設</span>`:""}</div>
        <div class="ag">需要：${a.g}</div>
        <div class="rx">目標 <b>${a.t||base.target}</b></div>
        <div class="row2">
          <button class="btn ghost sm" data-swapto="${i}-${slot}-${ai}" ${on?"disabled":""}>只有今天</button>
          <button class="btn accent sm" data-swapdef="${i}-${slot}-${ai}" ${isDef?"disabled":""}>以後都做這個</button>
        </div>
      </div>`;
    }).join("")}
    <button class="btn ghost sm" style="width:100%" data-swapopen="${i}${slot}">收起</button>
  </div>`;
}
function exRow(i, slot){
  const day = sessionCtx.day;
  const base = DAYS[day].supersets[i][slot];
  const ex = exOf(day,i,slot,sessionCtx.swaps);
  const swapped = !!ex.swapOf;
  const hasAlt = (ALT_LIB[base.en]||[]).length>0;
  const stage = state.stages[ex.name]||0;
  const last = lastActual(ex.name);
  return `
      <div class="ex-row">
        <div class="top"><span class="name">${slot.toUpperCase()} · ${ex.name}${ex.en&&EX_LIB[ex.en]?`<button class="exguide" data-exjump="${ex.en}">怎麼做</button>`:""}${hasAlt?`<button class="swapbtn" data-swapopen="${i}${slot}">${swapped?"換別的":"做不了？換動作"}</button>`:""}${swapped?`<span class="swaptag">替代</span>`:""}${swapped && (state.defaultSwaps||{})[base.en]===ex.name?`<span class="deftag">預設</span>`:""}${stage>0?`<span class="steptag">STEP ${stage} · ${STEPS[stage-1].t}</span>`:""}</span><span class="target">${ex.target}</span></div>
        ${ex.cue?`<div class="cue">${ex.cue}</div>`:""}
        ${last ? `<div class="lastline">上次（${fmtShort(last.date)}）：${last.vals.join("、")} ${unitOf(ex.target)}</div>` : ""}
      </div>
      ${sessionCtx.swapOpen===(i+slot) ? renderSwapPanel(i,slot) : ""}`;
}
function renderActual(ss, i){
  const day = sessionCtx.day;
  const A = exOf(day,i,"a",sessionCtx.swaps), B = exOf(day,i,"b",sessionCtx.swaps);
  if(!sessionCtx.actual) sessionCtx.actual = blankActual(day);
  const rows = sessionCtx.actual[i];
  const ph = t=> (String(t).match(/\d+/)||[""])[0];
  return `<table class="acttbl">
      <tr><th></th><th>A 實際（${unitOf(A.target)}）</th><th>B 實際（${unitOf(B.target)}）</th></tr>
      ${rows.map((r,ri)=>`<tr><td class="rn">第${ri+1}輪</td>
        <td><input type="number" inputmode="numeric" data-act="${i}-${ri}-a" value="${r.a}" placeholder="${ph(A.target)}"></td>
        <td><input type="number" inputmode="numeric" data-act="${i}-${ri}-b" value="${r.b}" placeholder="${ph(B.target)}"></td></tr>`).join("")}
    </table>
    <div class="actnote">兩格都填了就自動算完成 1 輪。「/邊」的動作填單邊次數。</div>`;
}
function renderSuperset(ss, i){
  const rounds = sessionCtx.rounds[i];
  const rir = sessionCtx.rir[i];
  const rirOptions = ["RIR 4+（很輕鬆）","RIR 2–3（剛剛好）","RIR 0–1（接近力竭）"];
  return `
    <div class="ss-block">
      <div class="ss-head"><span class="t">${ss.label}</span><span class="r">${rounds}/${ss.rounds} 輪</span></div>
      ${exRow(i,"a")}
      ${exRow(i,"b")}
      <div class="flow">${flowFor(sessionCtx.day,i,sessionCtx.swaps)}</div>
      ${renderActual(ss,i)}
      <div class="done-row">
        <button class="btn sm ghost" data-round-minus="${i}" ${rounds<=0?"disabled":""}>−1 輪</button>
        <label>已完成 ${rounds} / ${ss.rounds} 輪</label>
        <button class="btn sm accent" data-round-plus="${i}" ${rounds>=ss.rounds?"disabled":""}>+1 輪完成</button>
      </div>
      <button class="timer-btn" data-timer="${i}">⏱ 休息計時 45 秒</button>
      <div class="rir-row">
        <div class="rir-label">這組整體 RIR（保留次數）</div>
        <div class="chip-row">
          ${rirOptions.map((label,idx)=>`<span class="chip ${rir===idx?"sel":""}" data-rir="${i}" data-rir-val="${idx}">${label}</span>`).join("")}
        </div>
      </div>
    </div>
  `;
}

function bindTimer(idx){
  if(timerInterval) return;
  const btn = document.querySelector(`[data-timer="${idx}"]`);
  let secs = 45;
  btn.classList.add("running");
  btn.textContent = `⏱ 休息中 · ${secs} 秒`;
  timerInterval = setInterval(()=>{
    secs--;
    if(secs<=0){
      clearInterval(timerInterval); timerInterval=null;
      btn.classList.remove("running");
      btn.textContent = "✓ 休息完成，開始下一輪";
      if(navigator.vibrate) navigator.vibrate([200,80,200]);
      setTimeout(()=>{ if(btn) btn.textContent = "⏱ 休息計時 45 秒"; }, 2500);
    } else {
      btn.textContent = `⏱ 休息中 · ${secs} 秒`;
    }
  },1000);
}

/* ============ PROGRESS TAB (ladder) ============ */

  if(stage===0) return "基準難度。做起來符合 RIR 2–3 就維持現狀，把動作做標準。";
  const s = STEPS[stage-1];
  return `目前難度：${s.t} — ${s.d}`;
}
function renderProgress(){
  const exs = allExercises().concat(usedAlts());
  return `

      <div class="section-title"><span class="num">02</span><h2>進度階梯</h2></div>

    </div>
    ${exs.map(ex=>{

      <div class="ex-card">

/* ============ LOG TAB ============ */
function renderLog(){
  const sessions = [...state.sessions].sort((a,b)=> b.date.localeCompare(a.date));
  return `
    <div class="card">
      <div class="section-title"><span class="num">03</span><h2>訓練紀錄</h2></div>
      <div class="btn-row">
        <button class="btn ghost sm" id="exportBtn">匯出備份 (JSON)</button>
        <label class="btn ghost sm" style="cursor:pointer;">
          匯入備份
          <input type="file" id="importFile" accept="application/json" class="hidden">
        </label>
      </div>
      <div class="altsub">上次備份：${state.lastBackup ? fmtTs(state.lastBackup) : "從未備份"}</div>
    </div>
    ${sessions.length===0 ? `<div class="empty-state">還沒有任何紀錄，練完第一次訓練後會出現在這裡</div>` :
      sessions.map(s=>{
        const durMin = sessionDurationMin(s);
        return `
        <div class="log-item">
          <div class="top">
            <span class="date">${s.date}</span>
            <span class="day">DAY ${s.day} · ${DAYS[s.day].name}</span>
          </div>
          ${durMin ? `<div style="display:flex; align-items:baseline; gap:6px; margin:6px 0 2px;">
            <span style="font-size:11px; letter-spacing:.08em; opacity:.6;">訓練時長</span>
            <b style="font-size:26px; line-height:1;">${durMin}</b>
            <span style="font-size:12px; opacity:.6;">分鐘</span>
          </div>` : ""}
          <div class="ss-dots">
            ${s.rounds.map((r,i)=>`<span class="${r>=DAYS[s.day].supersets[i].rounds?"done":""}">SS${i+1} ${r}/${DAYS[s.day].supersets[i].rounds}</span>`).join("")}
          </div>
          ${(()=>{
            if(!s.actual) return "";
            const lines=[];
            DAYS[s.day].supersets.forEach((ss,i)=>["a","b"].forEach(slot=>{
              const v=(s.actual[i]||[]).map(r=>r[slot]).filter(x=>x!==""&&x!=null);
              if(!v.length) return;
              const e=exOf(s.day,i,slot,s.swaps);
              lines.push(`<div><b>${e.name}</b>：${v.join("、")} ${unitOf(e.target)}</div>`);
            }));
            return lines.length ? `<div class="pn">${lines.join("")}</div>` : "";
          })()}
          ${(()=>{
            const sw = s.swaps||{}; const out=[];
            Object.keys(sw).forEach(k=>{
              const i=+k.slice(0,-1), slot=k.slice(-1);
              if(!DAYS[s.day].supersets[i]) return;
              const e = exOf(s.day,i,slot,sw);
              if(e.swapOf) out.push("SS"+(i+1)+"-"+slot.toUpperCase()+"："+e.swapOf+" → "+e.name);
            });
            return out.length ? `<div class="pn">↔ 替代動作：${out.join("；")}</div>` : "";
          })()}
          ${s.note ? `<div class="pn">📝 ${s.note}</div>` : ""}
          <button class="del" data-del="${s.id}">刪除這筆紀錄</button>
        </div>
      `;}).join("")
    }
  `;
}

/* ============ GUIDE TAB ============ */
function renderGuide(){
  return `
    <div class="card">
      <div class="section-title"><span class="num">01</span><h2>三個貫穿全部的規則</h2></div>
      <table class="ladder-table">
        <tr><th>規則</th><th>意思</th></tr>
        <tr><td>RIR 保留次數</td><td>做完一組後還能再做幾下。新手先抓 RIR 2–3，不用一開始就拚力竭。動作熟悉後再慢慢往力竭靠近</td></tr>
        <tr><td>呼吸</td><td>核心與棒式類動作，正常呼吸，不要憋氣硬撐。撐到臉紅、閉氣用力就是做過頭了，寧可縮短秒數</td></tr>
        <tr><td>怎麼變強</td><td>沒有更重的啞鈴，用「難度」取代「重量」，見下方進度階梯</td></tr>
      </table>
      <div class="note">為什麼用 superset 兩動作交替：只有 30 分鐘，一個一個動作做休息完再做下一個會來不及。這份課表把動作兩兩配對，交替著做——做完 A 的一組，休息時間內順便準備 B，B 做完再回來做 A 的下一組。同樣的訓練量，時間省將近一半。</div>
    </div>

    <div class="card">
      <div class="section-title"><span class="num">02</span><h2>進度階梯（沒有更重的啞鈴時）</h2></div>
      <table class="ladder-table">
        <tr><th>Step</th><th>方法</th><th>說明</th></tr>
        ${STEPS.map(s=>`<tr><td class="step">${s.n}</td><td>${s.t}</td><td>${s.d}</td></tr>`).join("")}
      </table>
      <table class="ladder-table">
        <tr><th>狀況</th><th>怎麼處理</th></tr>
        <tr><td>動作做完還很輕鬆，RIR 明顯超過 3</td><td>用 STEP 1–5 依序加難度</td></tr>
        <tr><td>動作做起來剛剛好，符合 RIR 2–3</td><td>維持現狀，把動作做標準，這是最需要的階段</td></tr>
        <tr><td>連續兩次都做不完次數</td><td>退回上一階段難度，或前一輪的次數，先求穩定再進步</td></tr>
      </table>
      <div class="note">新手前 4–6 週不用急著加難度。先把動作學標準——蹲的深度、划船的肩胛夾緊、伏地挺身的身體一直線。動作品質決定你長不長得出線條，不是次數多寡。</div>
    </div>

    <div class="card">
      <div class="section-title"><span class="num">03</span><h2>飲食與恢復</h2></div>
      <table class="ladder-table">
        <tr><th>項目</th><th>建議怎麼做</th></tr>
        <tr><td>熱量</td><td>略低於或等於維持熱量。先不用精算，正常吃，觀察 2–3 週體重變化再微調</td></tr>
        <tr><td>蛋白質</td><td>約 115–130 g／day，這是唯一值得認真抓的數字。分散到三餐：蛋、雞胸、豆製品、乳製品</td></tr>
        <tr><td>先觀察</td><td>不急著減脂 4–6 週，規律訓練本身就會讓體態先有變化，之後再決定要不要疊加減脂期</td></tr>
      </table>
      <div class="note">睡眠 12 點睡、7 點起，長度算正常，但壓力偏高會影響恢復品質。這份課表刻意壓在 3 個 superset、6 個動作以內，就是為了在恢復空間有限時，仍然能穩定進步而不會累積疲勞。</div>
    </div>

    <div class="card">
      <div class="section-title"><span class="num">04</span><h2>卡關了怎麼辦</h2></div>
      ${FAQ.map((f,i)=>`
        <div class="faq-item">
          <div class="q"><span class="n">${i+1}</span>${f.q}</div>
          <div class="a">${f.a}</div>
        </div>`).join("")}
    </div>

    <div class="card">
      <div class="section-title"><span class="num">05</span><h2>一週怎麼排</h2></div>
      <table class="sched-table">
        <tr><td>DAY A</td><td>下肢＋核心 — 平日晚上</td></tr>
        <tr><td>DAY B</td><td>上肢 推＋拉 — 平日晚上</td></tr>
        <tr><td>DAY C</td><td>全身混合＋體能 — 平日晚上或週末</td></tr>
        <tr><td>DAY D</td><td>全身變化版 — 週末</td></tr>
      </table>
    </div>
  `;
}

/* ============ BIND DYNAMIC ============ */
function bindDynamic(){
  // Home
  document.querySelectorAll("[data-start]").forEach(b=>{
    b.addEventListener("click", ()=> startSession(b.dataset.start));
  });
  const pt = document.getElementById("proteinToggle");
  if(pt) pt.addEventListener("click", ()=>{
    const t = todayStr();
    state.protein[t] = !state.protein[t];
    saveState(); render();
  });

  // Session
  document.querySelectorAll("[data-warm]").forEach(cb=>{
    cb.addEventListener("change", (e)=>{
      sessionCtx.warmupChecked[+cb.dataset.warm] = e.target.checked;
    });
  });
  document.querySelectorAll("[data-round-plus]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const i = +b.dataset.roundPlus;
      const max = DAYS[sessionCtx.day].supersets[i].rounds;
      sessionCtx.rounds[i] = Math.min(max, sessionCtx.rounds[i]+1);
      render();
    });
  });
  document.querySelectorAll("[data-round-minus]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const i = +b.dataset.roundMinus;
      sessionCtx.rounds[i] = Math.max(0, sessionCtx.rounds[i]-1);
      render();
    });
  });
  document.querySelectorAll("[data-rir]").forEach(c=>{
    c.addEventListener("click", ()=>{
      const i = +c.dataset.rir;
      sessionCtx.rir[i] = +c.dataset.rirVal;
      render();
    });
  });
  document.querySelectorAll("[data-swapopen]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const k = b.dataset.swapopen;
      sessionCtx.swapOpen = (sessionCtx.swapOpen===k) ? null : k;
      render();
    });
  });
  function clearSlot(i, slot){
    if(sessionCtx.actual && sessionCtx.actual[i]) sessionCtx.actual[i].forEach(r=> r[slot]="");
  }
  function slotHasData(i, slot){
    return !!(sessionCtx.actual && sessionCtx.actual[i] && sessionCtx.actual[i].some(r=> r[slot]!==""));
  }
  function applySwap(i, slot, ai){
    if(!sessionCtx.swaps) sessionCtx.swaps = {};
    const key = i+slot;
    if(ai===null) delete sessionCtx.swaps[key]; else sessionCtx.swaps[key] = ai;
    clearSlot(i, slot);
    sessionCtx.swapOpen = null;
    render();
  }
  document.querySelectorAll("[data-swapto]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const [is, slot, ai] = b.dataset.swapto.split("-");
      const i = +is;
      if(slotHasData(i,slot) && !confirm("這個動作已經填了次數，換動作會清掉這個動作已填的次數。要換嗎？")) return;
      applySwap(i, slot, ai==="back" ? null : +ai);
    });
  });
  document.querySelectorAll("[data-swapdef]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const [is, slot, ai] = b.dataset.swapdef.split("-");
      const i = +is;
      const base = DAYS[sessionCtx.day].supersets[i][slot];
      const target = ai==="back" ? null : +ai;
      const curNow = sessionCtx.swaps ? sessionCtx.swaps[i+slot] : null;
      const changing = target===null ? (curNow!==null && curNow!==undefined) : curNow!==target;
      if(changing && slotHasData(i,slot) && !confirm("這個動作已經填了次數，換動作會清掉這個動作已填的次數。要換嗎？")) return;
      if(!state.defaultSwaps) state.defaultSwaps = {};
      if(target===null) delete state.defaultSwaps[base.en];
      else state.defaultSwaps[base.en] = ALT_LIB[base.en][target].n;
      saveState();
      if(changing) applySwap(i, slot, target); else { sessionCtx.swapOpen=null; render(); }
    });
  });
  document.querySelectorAll("[data-act]").forEach(inp=>{
    inp.addEventListener("input", (e)=>{
      const [is, rs, slot] = inp.dataset.act.split("-");
      const i=+is, ri=+rs;
      if(!sessionCtx.actual) sessionCtx.actual = blankActual(sessionCtx.day);
      sessionCtx.actual[i][ri][slot] = e.target.value;
      // 兩格都有填的輪數 → 自動推進「已完成輪數」，只增不減（手動按的不會被蓋掉）
      const filled = sessionCtx.actual[i].filter(r=> r.a!=="" && r.b!=="").length;
      if(filled > sessionCtx.rounds[i]){
        sessionCtx.rounds[i] = filled;
        // 不整頁重畫（會讓輸入框失焦），只更新這一組的輪數顯示
        const blk = inp.closest(".ss-block");
        const max = DAYS[sessionCtx.day].supersets[i].rounds;
        if(blk){
          const r = blk.querySelector(".ss-head .r"); if(r) r.textContent = `${filled}/${max} 輪`;
          const lab = blk.querySelector(".done-row label"); if(lab) lab.textContent = `已完成 ${filled} / ${max} 輪`;
          const mi = blk.querySelector("[data-round-minus]"); if(mi) mi.disabled = filled<=0;
          const pl = blk.querySelector("[data-round-plus]"); if(pl) pl.disabled = filled>=max;
        }
      }
      saveDraft();
    });
  });
  document.querySelectorAll("[data-timer]").forEach(b=>{
    b.addEventListener("click", ()=> bindTimer(+b.dataset.timer));
  });
  const noteEl = document.getElementById("sessionNote");
  if(noteEl) noteEl.addEventListener("input", (e)=>{ sessionCtx.note = e.target.value; });
  const finishBtn = document.getElementById("finishSession");
  if(finishBtn) finishBtn.addEventListener("click", ()=>{
    state.sessions.push({
      id: Date.now(),
      date: todayStr(),
      day: sessionCtx.day,
      startTime: sessionCtx.startTime || null,
      endTime: sessionCtx.startTime ? Date.now() : null,
      rounds: sessionCtx.rounds.slice(),
      rir: sessionCtx.rir.slice(),
      swaps: Object.assign({}, sessionCtx.swaps||{}),
      actual: (sessionCtx.actual||[]).map(rows=> rows.map(r=>({a:r.a, b:r.b}))),
      note: sessionCtx.note
    });
    saveState();
    clearDraft();
    if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
    sessionCtx = null;
    currentTab = "log";
    render();
  });
  const cancelBtn = document.getElementById("cancelSession");
  if(cancelBtn) cancelBtn.addEventListener("click", ()=>{
    if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
    clearDraft();
    sessionCtx = null;
    currentTab = "home";
    render();
  });

  bindExercises();
  // Progress
  document.querySelectorAll("[data-stage-plus]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const name = b.dataset.stagePlus;
      state.stages[name] = Math.min(5, (state.stages[name]||0)+1);
      saveState(); render();
    });
  });
  document.querySelectorAll("[data-stage-minus]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const name = b.dataset.stageMinus;
      state.stages[name] = Math.max(0, (state.stages[name]||0)-1);
      saveState(); render();
    });
  });

  // Log
  document.querySelectorAll("[data-del]").forEach(b=>{
    b.addEventListener("click", ()=>{
      if(!confirm("確定刪除這筆紀錄？")) return;
      state.sessions = state.sessions.filter(s=>s.id !== +b.dataset.del);
      saveState(); render();
    });
  });
  const exportBtn = document.getElementById("exportBtn");
  if(exportBtn) exportBtn.addEventListener("click", ()=>{ doExport(); render(); });
  const exportBtnHome = document.getElementById("exportBtnHome");
  if(exportBtnHome) exportBtnHome.addEventListener("click", ()=>{ doExport(); render(); });
  const importFile = document.getElementById("importFile");
  if(importFile) importFile.addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!confirm("匯入將覆蓋目前所有紀錄，確定嗎？")) return;
        state = {sessions:data.sessions||[], stages:data.stages||{}, protein:data.protein||{},
                 defaultSwaps:data.defaultSwaps||{}, lastBackup:Date.now(), theme:state.theme};
        saveState(); render();
      }catch(err){ alert("檔案格式錯誤，無法匯入"); }
    };
    reader.readAsText(file);
  });
}

// 分頁切到背景／即將關閉的瞬間強制存一次草稿——iOS Safari 真的會隨時把
// 背景分頁記憶體整個清掉，不能只靠使用者操作觸發的 render() 去存。
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") saveDraft(); });
window.addEventListener("pagehide", saveDraft);

applyTheme();
document.getElementById("themeBtn").addEventListener("click", toggleTheme);
restoreDraftIfAny();
render();
</script>
